# Netlify config — Hope Gala AR Photo Booth (Vite SPA)
[build]
  command = "npm run build"
  publish = "dist"

# beamwall.app is the one production address. The old netlify.app host 301s
# there (path kept, so printed QR codes still work) so nobody signs in on an
# origin Supabase won't return to. Host-scoped: deploy previews are untouched.
[[redirects]]
  from = "https://beamwall.netlify.app/*"
  to = "https://beamwall.app/:splat"
  status = 301
  force = true

# PostHog reverse proxy (src/lib/telemetry.ts posts to /ingest): same-origin,
# so ad/tracker blockers don't silently drop the error reports and replays we
# triage with. US cloud; an EU project changes both hosts to eu.* / eu-assets.*.
# Must sit ABOVE the SPA fallback below.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true

# Client-side routing: serve index.html for all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Camera/AR needs HTTPS (Netlify provides it). Allow camera in this origin.
# Security headers (no CSP yet — the app's inline/eval surface is unaudited).
# SAMEORIGIN (was DENY): the sales decks embed /try/:kit in an iframe on the
# same origin. Other sites still cannot frame any page (clickjacking guard).
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(self)"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Vite emits content-hashed filenames under /assets — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else under public/ keeps its filename across deploys (NOT
# content-hashed), so nothing below may be `immutable`: a changed file must
# reach browsers without a rename.
#
# Vendored runtimes, copied from node_modules at build (copy:vendor). Their JS
# entry points ship in the hashed /assets bundle while the wasm/workers live
# here, so a dependency bump must not leave a browser holding an old wasm
# against new JS for long: one hour fresh, then revalidated (a 304, no body).
[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/xr8/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/three/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Self-contained art (each file stands alone, so a stale copy is only old art,
# never a crash): a day fresh, then up to a week served while revalidating.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/mascot/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Only the asset folders: /guides itself and /guides/<slug> are SPA routes
# served as index.html, which must never be cached like this.
[[headers]]
  for = "/guides/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/guides/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

# Partnerships pages: the internal hub (hidden link) and prospect-facing pitch
# decks must never be indexed. The pages also set <meta name="robots"> while
# mounted; this header covers crawlers that don't run JS. Keep the hub path in
# step with SALES_HUB_PATH (src/lib/salesTypes.ts).
[[headers]]
  for = "/hub/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/pitch/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The decks' hands-on booth demo (/try/<kit>): prospect-facing, never indexed.
[[headers]]
  for = "/try/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The previous homepage, kept reachable at /classic (unlinked): never indexed.
# (/beamy, the new homepage's preview address, now redirects to "/" in the app.)
[[headers]]
  for = "/classic"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Brand v2 style guide (/brand): internal reference, never indexed.
[[headers]]
  for = "/brand"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/card-designs"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Marketing reveals (/reveal/<slug>): sent by email, never indexed.
[[headers]]
  for = "/reveal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Reps' public booking pages (/book/<ref>, migration 042): sent one-to-one,
# never indexed.
[[headers]]
  for = "/book/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
