# Vendors remote assets (Higgsfield CDN images/video/audio) into the repo.
#
# Why: the Claude Code sandbox's egress policy blocks the Higgsfield CDN, so
# generated media can't be downloaded there — but GitHub runners can. Add
# entries to scripts/remote-assets.json, push, then dispatch this workflow on
# the branch; it downloads everything and commits the files back.
name: Fetch remote assets

on:
  workflow_dispatch:
  # Also fire on manifest changes — the Claude GitHub integration can push but
  # lacks actions:write, so it can't dispatch workflows directly.
  push:
    paths:
      - "scripts/remote-assets.json"
      - ".github/workflows/fetch-remote-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets from manifest
        run: |
          set -euo pipefail
          count=$(jq '.assets | length' scripts/remote-assets.json)
          echo "Fetching $count assets"
          for i in $(seq 0 $((count - 1))); do
            url=$(jq -r ".assets[$i].url" scripts/remote-assets.json)
            path=$(jq -r ".assets[$i].path" scripts/remote-assets.json)
            # Vendor-once: source URLs are often short-lived (presigned CDN links
            # that 403 after expiry), so an asset already committed to the repo is
            # never re-fetched — one dead old URL must not block new assets.
            # To re-vendor a file, delete it (or change its manifest path) first.
            if [ -f "$path" ]; then
              echo "✓ $path (already vendored — skipping)"
              continue
            fi
            # The compress step converts vendored .wav → .m4a and deletes the
            # original, so the converted sibling also counts as vendored.
            if [ "${path%.wav}" != "$path" ] && [ -f "${path%.wav}.m4a" ]; then
              echo "✓ ${path%.wav}.m4a (already vendored as m4a — skipping)"
              continue
            fi
            # Same for hero pngs converted to .webp (original deleted below).
            if [ "${path%.png}" != "$path" ] && [ -f "${path%.png}.webp" ]; then
              echo "✓ ${path%.png}.webp (already vendored as webp — skipping)"
              continue
            fi
            mkdir -p "$(dirname "$path")"
            echo "→ $path"
            curl -fSL --retry 3 --retry-delay 2 -o "$path" "$url"
            # Record what THIS run fetched — the compress step must only touch
            # these. It used to re-encode every existing clip-*.mp4 on every
            # run: lossy CRF re-compression of already-compressed files, a
            # generation of quality lost per workflow run, committed as churn.
            echo "$path" >> /tmp/fetched-this-run.txt
          done

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Compress fetched media (studio assets only)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Narration WAVs → mono 96k AAC; raw generation MP4s → CRF-27 H.264,
          # audio stripped. Keeps the repo lean; ubuntu runners ship ffmpeg.
          for f in hyperframes/studio/assets/*.wav; do
            out="${f%.wav}.m4a"
            ffmpeg -y -i "$f" -ac 1 -c:a aac -b:a 96k "$out"
            rm "$f"
          done
          for f in hyperframes/studio/assets/clip-*.mp4; do
            # Freshly-fetched raw generations only — an already-committed clip
            # has been compressed once and must never be re-encoded (see the
            # note in the download step).
            grep -qxF "$f" /tmp/fetched-this-run.txt 2>/dev/null || continue
            tmp="${f%.mp4}.tmp.mp4"
            ffmpeg -y -i "$f" -c:v libx264 -preset slow -crf 27 -pix_fmt yuv420p -movflags +faststart -an "$tmp"
            mv "$tmp" "$f"
          done
          # Hero-carousel photos ship ONLY as lean webp: the cards render at
          # ≤208px wide (×3 dpr ≈ 624px), so 720w q82 is visually lossless
          # there while cutting the 2k source pngs ~30×. Originals deleted —
          # the .webp sibling marks them vendored (see the download guard).
          for f in src/assets/landing/hero/hero-*.png; do
            out="${f%.png}.webp"
            ffmpeg -y -i "$f" -vf "scale=720:-2" -c:v libwebp -lossless 0 -compression_level 6 -q:v 82 "$out"
            rm "$f"
          done
          # Teaser film art: the composition renders 1080×1920, so a 1080-wide
          # webp is the largest size any of it can ever be shown at. The 2k
          # sources are NOT committed — photos/ is already 78 MB of them, and
          # the .webp sibling marks the png vendored (see the download guard).
          for f in hyperframes/studio/assets/photos/teaser/*.png; do
            out="${f%.png}.webp"
            ffmpeg -y -i "$f" -vf "scale=1080:-2" -c:v libwebp -lossless 0 -compression_level 6 -q:v 86 "$out"
            rm "$f"
          done

      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — assets already vendored."
          else
            git commit -m "chore: vendor remote assets from manifest"
            # The branch may have moved while this job downloaded (another
            # session pushing) — a plain push then rejects as non-fast-forward
            # and the whole fetch is lost. Rebase-retry a few times; vendored
            # files are brand-new paths, so the rebase never conflicts.
            for i in 1 2 3; do
              git push && exit 0
              echo "push rejected (attempt $i) — rebasing onto the moved branch"
              git pull --rebase
            done
            git push
          fi
