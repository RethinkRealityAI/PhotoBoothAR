<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: it disabled pinch-zoom app-wide (WCAG 1.4.4), on the
         same surface that carries the pre-camera privacy line. viewport-fit and
         interactive-widget are kept — the booth relies on both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#262566" />
    <meta name="description" content="Every guest phone becomes the booth. Guests scan, snap in AR, and every shot beams to your live wall. No app for guests, and free to start." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beamwall" />

    <!-- No hard-coded canonical / og:url: this one HTML file serves EVERY SPA
         route, so a fixed "/" told crawlers that /guides, /privacy, /terms
         and the rest were all duplicates of the homepage. The public pages
         set their own canonical (https://beamwall.app/...) while mounted via
         usePageMeta (src/lib/usePageTitle.ts). -->

    <!-- Fonts: SELF-HOSTED (public/fonts/, latin + latin-ext woff2 vendored
         from the exact css2 set this file used to fetch from Google at
         runtime). A venue with bad wifi must never block on fonts.gstatic.com
         — same reasoning as the vendored MediaPipe/Draco/face-landmarker
         assets. Families/weights are the ones the platform theme actually
         uses (Cormorant = --font-serif, Inter = --font-sans, Jost =
         --font-label). Pinyon Script is NOT loaded here: only the legacy gala
         events use it, and their configs inject their own fontHref (still
         remote, frozen) at runtime.
         PRELOADS = the brand v2 faces every platform page actually paints
         (Geist = UI text, Bricolage = display; @font-face in styles/brand.css).
         Without these the browser only discovers them after the CSS + JS
         have run (~3.5s on a throttled phone) while the old Inter/Cormorant
         preloads downloaded fonts the platform never renders. Legacy
         (VITE_EVENT) builds get their original two preloads and theme-color
         back byte-for-byte from the legacyFrozenHead plugin in vite.config.ts. -->
    <link rel="preload" href="/fonts/geist-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Open Graph / share preview -->
    <meta property="og:title" content="Beamwall · Your immersive photo booth" />
    <meta property="og:description" content="Every guest phone becomes the booth. Guests scan, snap in AR, and every shot beams to your live wall. Free to start." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beamwall" />
    <meta property="og:image" content="https://beamwall.app/og.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Beamwall, your immersive photo booth, with Beamy the mascot on a dusk-blue background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://beamwall.app/og.jpg" />

    <!-- Real files (public/), so /favicon.ico (fetched by crawlers and old
         browsers without asking) and the manifest are no longer answered by
         the SPA fallback with index.html. Art = the previous inline icon:
         favicon.svg is that SVG verbatim, the PNGs/ICO are renders of it.
         Keep exactly ONE rel="icon": EventContext.setFavicon swaps the first
         one for an event's own icon, and a second would win over it. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Beamwall · Your immersive photo booth</title>

    <!-- Structured data: Organization + product (real tiers, no fabricated
         ratings). No FAQPage: the homepage ("/") shows no FAQ, and structured
         data may only describe what the page shows (the old landing's FAQ now
         lives at /classic, which is noindex). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://beamwall.app/#org",
          "name": "Beamwall",
          "url": "https://beamwall.app/",
          "email": "dapo@rethinkreality.ai"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Beamwall",
          "url": "https://beamwall.app/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Web browser (iOS Safari, Android Chrome, desktop)",
          "description": "Self-serve event photo booth, live photo wall, photo challenges and keepsake cards. Hosts pick a theme or upload their invitation and choose ready-made frames and filters; guests scan one QR code and snap photos in their browser — no app to download — while every shot beams onto a live photo wall.",
          "image": "https://beamwall.app/og.jpg",
          "publisher": { "@id": "https://beamwall.app/#org" },
          "offers": [
            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "description": "1 live event, up to 25 photos, photos kept for 7 days, 3 free AI frames per event, small Beamwall watermark on photos." },
            { "@type": "Offer", "name": "Essentials", "price": "49", "priceCurrency": "USD", "description": "Per event. Up to 500 photos & videos, video capture, no watermark, photos kept for 90 days, plus 20 AI credits." },
            { "@type": "Offer", "name": "Premium", "price": "99", "priceCurrency": "USD", "description": "Per event. Unlimited photos & videos, keepsake cards, photos kept for 365 days, plus 100 AI credits." },
            { "@type": "Offer", "name": "Deluxe", "price": "169", "priceCurrency": "USD", "description": "Per event. Everything in Premium plus 90-second video clips, a keepsake highlight film and premium card renders, photos kept for 2 years." },
            { "@type": "Offer", "name": "Beamwall Pro", "price": "79", "priceCurrency": "USD", "description": "Per month. Premium on every event, plus 300 AI credits a month." }
          ]
        }
      ]
    }
    </script>
      <!-- World tracking (booth world mode only, loaded on demand by src/lib/world/xr8World.ts):
         @8thwall/engine-binary 1.0.0, (c) Niantic Spatial, XR Engine License:
         https://github.com/8thwall/engine/blob/main/LICENSE (loaded unmodified from jsDelivr, as the licence requires) -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Booth <-> AR mode is a page load (two 8th Wall engines can't share a
         page). When the booth left a fresh note (src/lib/world/arSession.ts,
         AR_SWITCH_KEY) paint a plain "Switching…" screen at once, so there is
         no blank page before the app loads; the booth replaces it with its own.
         Does nothing without the note (every other page, every legacy build). -->
    <script>
      (function () {
        try {
          var n = JSON.parse(sessionStorage.getItem('bw.arSwitch') || 'null');
          if (!n || (n.dir !== 'enter' && n.dir !== 'leave') || !(Date.now() - n.t >= 0 && Date.now() - n.t < 15000)) return;
          var a = /^#[0-9a-fA-F]{3,8}$/.test(n.accent) ? n.accent : '#8f8cf5';
          var d = document.createElement('div');
          d.id = 'ar-switch-boot';
          d.setAttribute('role', 'status');
          d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:0 32px;color:#fff;font-family:Geist,system-ui,sans-serif;background:radial-gradient(60% 45% at 50% 46%,' + a + '33,transparent 70%),#0b0b1a';
          var t = document.createElement('p');
          t.style.cssText = 'margin:0;font-size:20px;line-height:28px;font-weight:600';
          t.textContent = n.dir === 'enter' ? 'Switching to AR mode' : 'Back to the booth';
          var s = document.createElement('p');
          s.style.cssText = 'margin:0;font-size:14px;line-height:20px;opacity:.65';
          s.textContent = n.dir === 'enter' ? 'Getting your space ready' : 'Turning the selfie camera on';
          // Same layout as the booth's own screen (icon space, text, bar), so nothing jumps.
          var icon = document.createElement('div'); icon.style.cssText = 'height:112px';
          var text = document.createElement('div'); text.style.cssText = 'display:flex;flex-direction:column;gap:8px';
          var bar = document.createElement('div'); bar.style.cssText = 'height:4px;width:128px;border-radius:9px;background:rgba(255,255,255,.1)';
          text.appendChild(t); text.appendChild(s);
          d.appendChild(icon); d.appendChild(text); d.appendChild(bar);
          document.body.appendChild(d);
          // Never strand anyone behind it (an error page, a slow load): lift it after 8 s.
          setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 8000);
        } catch (e) { /* no storage: no screen */ }
      })();
    </script>
    <noscript>
      <p>
        Beamwall turns every guest&rsquo;s phone into your event photo booth, with a live photo
        wall the whole room watches. Hosts pick a theme, choose ready-made frames and filters, and
        share one QR code; guests scan it and snap photos right in their browser — no app to
        download. Set up in minutes, nothing to design.
        Beamwall needs JavaScript to run. <a href="/signup">Create your free event</a>,
        <a href="/login">sign in</a>, or read our <a href="/privacy">Privacy Policy</a> and
        <a href="/terms">Terms of Service</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
