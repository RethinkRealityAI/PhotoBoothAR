<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: it disabled pinch-zoom app-wide (WCAG 1.4.4), on the
         same surface that carries the pre-camera privacy line. viewport-fit and
         interactive-widget are kept — the booth relies on both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#05060B" />
    <meta name="description" content="Every guest phone becomes the booth. Guests scan, snap in AR, and every shot beams to your live wall. No app for guests, and free to start." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beamwall" />

    <!-- No hard-coded canonical / og:url: this one HTML file serves EVERY SPA
         route, so a fixed "/" told crawlers that /guides, /privacy, /terms
         and the rest were all duplicates of the homepage. Without them each
         URL is its own canonical. -->

    <!-- Fonts: SELF-HOSTED (public/fonts/, latin + latin-ext woff2 vendored
         from the exact css2 set this file used to fetch from Google at
         runtime). A venue with bad wifi must never block on fonts.gstatic.com
         — same reasoning as the vendored MediaPipe/Draco/face-landmarker
         assets. Families/weights are the ones the platform theme actually
         uses (Cormorant = --font-serif, Inter = --font-sans, Jost =
         --font-label). Pinyon Script is NOT loaded here: only the legacy gala
         events use it, and their configs inject their own fontHref (still
         remote, frozen) at runtime. -->
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Open Graph / share preview -->
    <meta property="og:title" content="Beamwall · Your immersive photo booth" />
    <meta property="og:description" content="Every guest phone becomes the booth. Guests scan, snap in AR, and every shot beams to your live wall. Free to start." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://beamwall.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://beamwall.netlify.app/og.jpg" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B8CFF'/%3E%3Cstop offset='1' stop-color='%237C6CF7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305060B' stroke='url(%23g)' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' text-anchor='middle' fill='url(%23g)'%3EB%3C/text%3E%3C/svg%3E" />

    <title>Beamwall · Your immersive photo booth</title>

    <!-- Structured data: Organization + product (real tiers, no fabricated
         ratings). No FAQPage: the homepage ("/") shows no FAQ, and structured
         data may only describe what the page shows (the old landing's FAQ now
         lives at /classic, which is noindex). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://beamwall.netlify.app/#org",
          "name": "Beamwall",
          "url": "https://beamwall.netlify.app/",
          "email": "dapo@rethinkreality.ai"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Beamwall",
          "url": "https://beamwall.netlify.app/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Web browser (iOS Safari, Android Chrome, desktop)",
          "description": "Self-serve event photo booth, live photo wall, photo challenges and keepsake cards. Hosts pick a theme or upload their invitation and choose ready-made frames and filters; guests scan one QR code and snap photos in their browser — no app to download — while every shot beams onto a live photo wall.",
          "image": "https://beamwall.netlify.app/og.jpg",
          "publisher": { "@id": "https://beamwall.netlify.app/#org" },
          "offers": [
            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "description": "1 live event, up to 25 photos, photos kept for 7 days, 3 free AI frames per event, small Beamwall watermark on photos." },
            { "@type": "Offer", "name": "Essentials", "price": "49", "priceCurrency": "USD", "description": "Per event. Up to 500 photos & videos, video capture, no watermark, photos kept for 90 days, plus 20 AI credits." },
            { "@type": "Offer", "name": "Premium", "price": "99", "priceCurrency": "USD", "description": "Per event. Unlimited photos & videos, keepsake cards, photos kept for 365 days, plus 100 AI credits." },
            { "@type": "Offer", "name": "Deluxe", "price": "169", "priceCurrency": "USD", "description": "Per event. Everything in Premium plus a keepsake highlight film and premium card renders, photos kept for 365 days." },
            { "@type": "Offer", "name": "Beamwall Pro", "price": "79", "priceCurrency": "USD", "description": "Per month. Premium on every event, plus 300 AI credits a month." }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Beamwall turns every guest&rsquo;s phone into your event photo booth, with a live photo
        wall the whole room watches. Hosts pick a theme, choose ready-made frames and filters, and
        share one QR code; guests scan it and snap photos right in their browser — no app to
        download. Set up in minutes, nothing to design.
        Beamwall needs JavaScript to run. <a href="/signup">Create your free event</a>,
        <a href="/login">sign in</a>, or read our <a href="/privacy">Privacy Policy</a> and
        <a href="/terms">Terms of Service</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
