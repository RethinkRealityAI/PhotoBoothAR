<!doctype html>
<!--
  Keepsake Film — HyperFrames cinematic render of a Beamwall keepsake.
  ======================================================================
  Two callers, one composition:
    • the next-day EVENT film (scripts/keepsake-worker.mjs, payload built by
      send-keepsakes/autopilot.ts buildEventFilmPayload), and
    • the greeting-CARD film (supabase/functions/card-render, cloud render).
  A SEPARATE composition from the React web viewer (src/components/cards/
  templates/*). The web card stays React; THIS is the premium MP4 "film".

  Data-driven: everything is built at load from the payload (JSON of
  { card, contributions, music? }). The film:
    1. Title card — a beam of light drops from the top, strikes, and spreads
       into a wide anamorphic flare; the title rises out of it with the date
       line (event films: card.dateLine) or the recipient (cards).
    2. One scene per contribution — photo → Ken-Burns push with a different
       direction and easing per shot; video → framework-owned clip; text →
       typographic message card. Scenes CROSS-dissolve, each cut carrying a
       light-leak sweep, an anamorphic streak and a soft flash.
    3. End card — event films: card.signOff + card.hostName in foil, the date
       and "Made with Beamwall"; cards: the classic closing.
  Over all of it: soft film grain, a vignette, letterbox bars, a watermark.

  BEAT-AWARE: when payload.music.bpm is present (the worker adds it from
  public/keepsake-music/tracks.json; every track's beat 1 is its first
  sample), every scene length is a whole number of beats (an even number at
  fast tempos), so every cut — and the title's beam strike — lands on a beat
  of the music the worker mixes under the film. No music → nominal lengths.

  THEME: card.theme { bg, fg, accent, glow, surface, muted } (aliases below)
  drives every colour; the declared variables are the fallback. Light themes
  (ivory) switch the vignette, bars and fade to their own tones.

  HyperFrames contract honoured:
    - standalone root (no <template> wrapper), fixed 1920x1080 frame.
    - root OMITS data-duration on purpose → render length is derived from the
      GSAP timeline, so the film grows/shrinks with the number of contributions.
    - exactly one paused gsap.timeline registered at window.__timelines.keepsake,
      built synchronously at load. A late `payload` variable REFILLS that same
      timeline instance (tl.clear() + rebuild) — it is never replaced, so a
      reference the renderer captured early stays valid.
    - all clips are DIRECT children of #root; <video> clips are direct root
      children with framework-owned playback (no .play()/seek in our code).
      Overlapping clips never share a track (scenes 1/2, captions 3/4,
      videos 5/6).
    - deterministic: no clocks, no Math.random (grain + motes use a seeded
      mulberry32), GSAP only, no network at render time (GSAP and the fonts
      are vendored beside this file; photos arrive as bundle-local files,
      data-URIs or signed URLs baked into the payload).
    - guest text is inserted with textContent only (never innerHTML) — no markup
      injection from contributor names / messages.

  Local preview/render works with the built-in default `payload`; the edge
  function (supabase/functions/card-render) overrides it per card via
  --variables at cloud-render time — and because those variables land only
  AFTER the initial synchronous build, the init script keeps asking for one for
  up to 3s and rebuilds the film in place when it arrives (see "Boot" at the
  bottom of that script). Without that wait a cloud render silently produces
  the FIXTURE film below.

  ⚠ OWNER STEP — RE-UPLOAD REQUIRED. HeyGen renders the composition ASSET that
  was uploaded to it (HEYGEN_HYPERFRAMES_ASSET_ID), not this file in the repo.
  No change here — the late-variable wait included — reaches production until
  this bundle (index.html + gsap.min.js + fonts/) is re-uploaded to HeyGen and,
  if the upload mints a new id, HEYGEN_HYPERFRAMES_ASSET_ID is updated to
  match. Without fonts/ the cloud film falls back to Georgia/Arial (as before).
  See docs/DEPLOYMENT-CHECKLIST.md §5.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"payload","type":"string","label":"Card payload (JSON)","default":"{\"card\":{\"title\":\"With Love, Always\",\"recipientName\":\"Mum\",\"eventName\":\"Her 60th Birthday\",\"template\":\"storybook\",\"theme\":{}},\"contributions\":[{\"contributorName\":\"The Family\",\"message\":\"Sixty years of grace, laughter and impossibly good roast dinners. Here is a little film from all of us who love you.\",\"mediaType\":\"text\",\"url\":null,\"durationSeconds\":null},{\"contributorName\":\"Grace\",\"message\":\"Thank you for every bedtime story and every scraped-knee plaster. You made the whole world feel safe.\",\"mediaType\":\"photo\",\"url\":null,\"durationSeconds\":null},{\"contributorName\":\"Tomiwa\",\"message\":\"To the woman who taught me that kindness is a kind of courage. Happy birthday, Mum.\",\"mediaType\":\"text\",\"url\":null,\"durationSeconds\":null}]}"},
    {"id":"accent","type":"color","label":"Accent (foil)","default":"#d4af37"},
    {"id":"bg","type":"color","label":"Background (noir)","default":"#0c0906"},
    {"id":"fg","type":"color","label":"Foreground (cream)","default":"#f5efe2"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Keepsake Film</title>
    <script src="./gsap.min.js"></script>
    <!--
      Payload injection slot. The render harness (local build-render.mjs)
      replaces the contents of this script with
      `window.__KEEPSAKE_PAYLOAD__ = { card, contributions };` BEFORE the init
      script below runs. This is the reliable, deterministic injection channel:
      HyperFrames `--variables` overrides are only populated AFTER the initial
      synchronous build, so a baked global is the one channel guaranteed to be
      there at build time — and it always wins the resolution order. When it is
      absent (the cloud path, where card-render passes `variables.payload`), the
      init script polls for the late variable and rebuilds. Left empty here so
      standalone preview uses the declared default.
    -->
    <script id="kf-payload-data">/* window.__KEEPSAKE_PAYLOAD__ = … (injected at render time) */</script>
    <style>
      /* Vendored (OFL-1.1, @fontsource builds — licences in fonts/). */
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 500;
        src: url("fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 600;
        src: url("fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 600;
        src: url("fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Jost";
        font-style: normal;
        font-weight: 500;
        src: url("fonts/jost-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Jost";
        font-style: normal;
        font-weight: 600;
        src: url("fonts/jost-latin-600-normal.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* Palette — overwritten from theme/vars in the init script. */
        --accent: #d4af37;
        --glow: #ffb54d;
        --bg: #0c0906;
        --bg2: #16100a;
        --bg-deep: #000;
        --fg: #f5efe2;
        --muted: #cfc6b4;
        --fg-rgb: 245, 239, 226;
        --accent-rgb: 212, 175, 55;
        --glow-rgb: 255, 181, 77;
        --vignette: rgba(0, 0, 0, 0.72);
        --bars: #000;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        color: var(--fg);
      }
      .kf-sans {
        font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
      }

      /* Persistent layers — no class="clip" ⇒ visible for the whole film. */
      #kf-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 8%, var(--bg2) 0%, var(--bg) 58%, var(--bg-deep) 100%);
      }
      #kf-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 40% at 50% 0%, rgba(var(--accent-rgb), 0.16) 0%, transparent 70%),
          radial-gradient(50% 35% at 50% 100%, rgba(var(--glow-rgb), 0.08) 0%, transparent 70%);
      }
      /* Light leak: two soft colour blooms that sweep across a cut. */
      #kf-leak {
        position: absolute;
        top: -200px;
        left: 0;
        width: 1500px;
        height: 1480px;
        z-index: 40;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0;
        will-change: transform, opacity;
        background:
          radial-gradient(38% 30% at 42% 46%, rgba(var(--glow-rgb), 0.85) 0%, rgba(var(--glow-rgb), 0.25) 45%, transparent 72%),
          radial-gradient(30% 44% at 64% 58%, rgba(var(--accent-rgb), 0.7) 0%, rgba(var(--accent-rgb), 0.18) 50%, transparent 75%);
      }
      /* Anamorphic streak: a long horizontal flare across a cut. */
      #kf-streak {
        position: absolute;
        left: -480px;
        width: 2880px;
        top: 470px;
        height: 140px;
        z-index: 45;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0;
        will-change: transform, opacity;
        background:
          linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb), 0.5) 30%, rgba(255, 255, 255, 0.95) 50%, rgba(var(--accent-rgb), 0.5) 70%, transparent 100%) center / 100% 4px no-repeat,
          radial-gradient(50% 50% at 50% 50%, rgba(var(--glow-rgb), 0.45) 0%, rgba(var(--accent-rgb), 0.16) 40%, transparent 72%);
      }
      #kf-flash {
        position: absolute;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(70% 70% at 50% 50%, #fff 0%, rgba(var(--glow-rgb), 0.9) 60%, rgba(var(--accent-rgb), 0.8) 100%);
      }
      #kf-grain {
        position: absolute;
        inset: -200px;
        z-index: 55;
        pointer-events: none;
        opacity: 0.11;
        will-change: transform;
      }
      #kf-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 60;
        box-shadow: inset 0 0 360px 110px var(--vignette);
      }
      #kf-fade {
        position: absolute;
        inset: 0;
        z-index: 65;
        pointer-events: none;
        opacity: 0;
        background: var(--bg-deep);
      }
      /* Cinematic letterbox bars. */
      #kf-bars-top,
      #kf-bars-bottom {
        position: absolute;
        left: 0;
        right: 0;
        height: 72px;
        background: var(--bars);
        z-index: 70;
        pointer-events: none;
      }
      #kf-bars-top {
        top: 0;
      }
      #kf-bars-bottom {
        bottom: 0;
      }

      /* Scene shell — one per clip, direct child of #root. */
      .kf-scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        z-index: 10;
        will-change: opacity;
      }

      /* ── Title & closing ─────────────────────────────────────────── */
      .kf-eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.46em;
        font-size: 22px;
        font-weight: 600;
        color: var(--accent);
        margin: 0 0 34px;
      }
      .kf-title {
        font-size: 132px;
        font-weight: 600;
        line-height: 1.02;
        margin: 0;
        max-width: 1560px;
        letter-spacing: -0.01em;
        text-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
      }
      .kf-title.is-long {
        font-size: 104px;
      }
      .kf-title.is-xlong {
        font-size: 84px;
      }
      .kf-foil {
        background: linear-gradient(115deg, var(--accent) 0%, var(--glow) 30%, var(--fg) 50%, var(--accent) 70%, var(--glow) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: none;
      }
      /* The flare the title beam spreads into; full frame width, centred
         on the column whatever the text width. */
      .kf-flare {
        position: relative;
        width: 1920px;
        height: 120px;
        margin: -22px 0 -24px calc(50% - 960px);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        background:
          linear-gradient(90deg, transparent 4%, rgba(var(--accent-rgb), 0.55) 30%, rgba(255, 255, 255, 0.95) 50%, rgba(var(--accent-rgb), 0.55) 70%, transparent 96%) center / 100% 3px no-repeat,
          radial-gradient(42% 50% at 50% 50%, rgba(var(--glow-rgb), 0.38) 0%, rgba(var(--accent-rgb), 0.12) 42%, transparent 70%);
      }
      .kf-beam {
        position: absolute;
        left: 50%;
        top: 0;
        width: 220px;
        margin-left: -110px;
        height: 54%;
        transform-origin: 50% 0;
        will-change: transform, opacity;
        mix-blend-mode: screen;
        background:
          linear-gradient(180deg, transparent 0%, rgba(var(--accent-rgb), 0.7) 40%, #fff 100%) center / 4px 100% no-repeat,
          linear-gradient(90deg, transparent 0%, rgba(var(--glow-rgb), 0.16) 35%, rgba(var(--accent-rgb), 0.3) 50%, rgba(var(--glow-rgb), 0.16) 65%, transparent 100%);
      }
      .kf-sub {
        text-transform: uppercase;
        letter-spacing: 0.32em;
        font-size: 26px;
        font-weight: 500;
        color: rgba(var(--fg-rgb), 0.82);
        margin: 0;
      }
      .kf-count {
        font-size: 19px;
        letter-spacing: 0.22em;
        color: rgba(var(--fg-rgb), 0.55);
        margin: 18px 0 0;
        text-transform: uppercase;
        font-weight: 500;
      }
      .kf-signoff {
        font-size: 66px;
        font-style: italic;
        font-weight: 500;
        color: rgba(var(--fg-rgb), 0.86);
        margin: 0 0 6px;
      }
      .kf-inner {
        position: relative;
        padding: 0 120px;
        max-width: 1640px;
        z-index: 2;
      }
      .kf-mote {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(var(--glow-rgb), 0.9);
        box-shadow: 0 0 14px 4px rgba(var(--glow-rgb), 0.45);
        will-change: transform, opacity;
      }

      /* ── Text message scene ──────────────────────────────────────── */
      .kf-quotemark {
        font-size: 190px;
        line-height: 0.4;
        color: rgba(var(--accent-rgb), 0.5);
        height: 78px;
        margin: 0 0 8px;
      }
      .kf-message {
        font-size: 66px;
        line-height: 1.32;
        font-style: italic;
        font-weight: 500;
        margin: 0 auto;
        max-width: 1360px;
        color: var(--fg);
        display: -webkit-box;
        -webkit-line-clamp: 6;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .kf-from {
        text-transform: uppercase;
        letter-spacing: 0.32em;
        font-size: 22px;
        font-weight: 600;
        color: var(--accent);
        margin: 54px 0 0;
      }
      .kf-from::before {
        content: "— ";
        color: rgba(var(--accent-rgb), 0.7);
      }

      /* ── Photo / video scene ─────────────────────────────────────── */
      .kf-media-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .kf-photo {
        position: absolute;
        inset: -6%; /* bleed so the Ken-Burns pan never shows an edge */
        width: 112%;
        height: 112%;
        object-fit: cover;
        will-change: transform;
      }
      /* fit: "contain" (event films: portrait booth shots). The whole photo
         stays in frame over a blurred, dimmed copy of itself, so a 9:16 shot
         in a 16:9 film is never cropped to a mouth. Cards keep "cover". */
      .kf-photo-bg {
        position: absolute;
        inset: -10%;
        width: 120%;
        height: 120%;
        object-fit: cover;
        filter: blur(48px) brightness(0.4) saturate(1.2);
      }
      .kf-photo.kf-photo--contain {
        inset: 7% 0 5%;
        width: 100%;
        height: 88%;
        object-fit: contain;
        filter: drop-shadow(0 28px 60px rgba(0, 0, 0, 0.6));
      }
      .kf-media-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.42) 22%, rgba(0, 0, 0, 0) 44%);
      }
      .kf-caption {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 132px;
        text-align: left;
        z-index: 20;
        color: #fff;
      }
      .kf-caption .kf-cap-msg {
        font-size: 50px;
        line-height: 1.3;
        font-style: italic;
        font-weight: 500;
        margin: 0;
        max-width: 1400px;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.8);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .kf-caption .kf-cap-from {
        text-transform: uppercase;
        letter-spacing: 0.3em;
        font-size: 21px;
        font-weight: 600;
        color: var(--accent);
        margin: 20px 0 0;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.7);
      }
      .kf-caption .kf-cap-from::before {
        content: "";
        display: inline-block;
        width: 46px;
        height: 2px;
        margin: 0 18px 6px 0;
        vertical-align: middle;
        background: var(--accent);
      }
      .kf-index {
        position: absolute;
        top: 104px;
        right: 120px;
        z-index: 20;
        font-size: 18px;
        letter-spacing: 0.34em;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.62);
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
      }

      /* Video clip fills the frame; framework owns playback. Background is
         transparent (not black) so that if a runtime-created <video>'s frames
         fail to composite — HyperFrames' frame producer maps extracted frames
         to elements present at the initial DOM scan — the scene degrades
         gracefully to the themed backdrop + caption rather than a black rectangle. */
      .kf-video {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        background: transparent;
        z-index: 10;
      }

      /* Watermark — quiet, persistent. */
      #kf-mark {
        position: absolute;
        right: 46px;
        bottom: 24px;
        z-index: 80;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(var(--fg-rgb), 0.42);
      }
      #kf-mark b {
        color: rgba(var(--accent-rgb), 0.88);
        font-weight: 600;
      }
      #root.is-light #kf-mark {
        color: rgba(var(--fg-rgb), 0.55);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="keepsake" data-start="0" data-width="1920" data-height="1080">
      <div id="kf-bg"></div>
      <div id="kf-leak"></div>
      <div id="kf-streak"></div>
      <div id="kf-flash"></div>
      <div id="kf-grain"></div>
      <div id="kf-vignette"></div>
      <div id="kf-fade"></div>
      <div id="kf-bars-top"></div>
      <div id="kf-bars-bottom"></div>
      <div id="kf-mark" class="kf-sans">Made with <b>Beamwall</b></div>
      <!-- scenes are injected here by the init script -->
    </div>

    <script>
      (function () {
        "use strict";

        /* ── Runtime variables (with a safe fallback for raw file opens) ── */
        function readVars() {
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              return window.__hyperframes.getVariables() || {};
            }
          } catch (e) {
            /* fall through to declared defaults */
          }
          try {
            var decl = JSON.parse(
              document.documentElement.getAttribute("data-composition-variables") || "[]"
            );
            var out = {};
            decl.forEach(function (d) {
              out[d.id] = d.default;
            });
            return out;
          } catch (e) {
            return {};
          }
        }

        /* ── Parse the payload ─────────────────────────────────────────── */
        function parsePayload(raw) {
          if (raw && typeof raw === "object") return raw; // already an object
          try {
            return JSON.parse(raw);
          } catch (e) {
            return null;
          }
        }

        /* The RUNTIME payload only — never the declared default. This is the
           channel the cloud renderer populates (`variables.payload`) and the
           one the poll at the bottom of this script waits for; readVars()
           cannot serve that purpose because it falls back to the declared
           default, which is indistinguishable from a real late arrival. */
        function runtimePayload() {
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              return parsePayload((window.__hyperframes.getVariables() || {}).payload);
            }
          } catch (e) {
            /* no runtime in this context */
          }
          return null;
        }

        /* Seeded PRNG — grain, motes and shot order never use Math.random. */
        function mulberry32(seed) {
          var a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            var t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        /* ── ONE paused timeline, registered SYNCHRONOUSLY ─────────────────
           The contract is that a paused timeline exists at
           window.__timelines.keepsake at the end of the initial synchronous
           build, so it is created and registered HERE, before any content. A
           late payload REFILLS this same instance (resetFilm → buildFilm)
           instead of replacing it, so a reference captured early keeps
           pointing at the film that actually renders. */
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["keepsake"] = tl;

        var root = document.getElementById("root");
        var leak = document.getElementById("kf-leak");
        var streak = document.getElementById("kf-streak");
        var flash = document.getElementById("kf-flash");
        var grain = document.getElementById("kf-grain");
        var fade = document.getElementById("kf-fade");

        /* Film grain: one 200px noise tile, drawn once from a fixed seed. */
        (function paintGrain() {
          try {
            var c = document.createElement("canvas");
            c.width = 200;
            c.height = 200;
            var g = c.getContext("2d");
            var img = g.createImageData(200, 200);
            var r = mulberry32(0x9e3779b9);
            for (var i = 0; i < img.data.length; i += 4) {
              var v = r() < 0.5 ? 0 : 255;
              img.data[i] = v;
              img.data[i + 1] = v;
              img.data[i + 2] = v;
              img.data[i + 3] = Math.floor(r() * 150);
            }
            g.putImageData(img, 0, 0);
            grain.style.backgroundImage = "url(" + c.toDataURL("image/png") + ")";
          } catch (e) {
            /* no canvas: the film simply has no grain */
          }
        })();

        /* Drop the previous build's clips (the persistent chrome children —
           #kf-bg, leak, streak, flash, grain, vignette, fade, bars, watermark —
           carry no marker and stay). */
        function resetFilm() {
          tl.clear();
          var built = root.querySelectorAll("[data-kf-built]");
          for (var i = 0; i < built.length; i++) built[i].parentNode.removeChild(built[i]);
        }
